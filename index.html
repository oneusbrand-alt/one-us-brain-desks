<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>One US Brain</title>
<style>:root{--ink:#1c1915;--muted:#6d655c;--line:#e3dbd0;--paper:#f3efe8;--card:#fffcf8;--gold:#8a6a32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,Palatino,serif}button,textarea{font:inherit;color:inherit}.shell{max-width:760px;margin:0 auto;padding:14px 14px 48px}.top{display:flex;justify-content:space-between;font:11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;margin:14px 0 2px}.who{margin:0 0 12px;color:var(--muted)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.switch button,.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px;font-family:-apple-system,sans-serif;font-size:14px}.switch button.on{background:var(--ink);color:var(--paper)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:block;width:100%;text-align:left}.card strong{display:block;font-size:17px}.card em{font-style:normal;color:var(--muted);font:13px/1.35 -apple-system,sans-serif}h2{font:600 11px/1.2 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}.desk,.room{display:none}.desk.on,.room.on{display:block}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.row{display:flex;gap:8px;margin-top:8px}.solid{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-family:-apple-system,sans-serif}.mark{border-left:3px solid var(--gold)}.err{color:#8a3b2f}a{color:var(--ink)}iframe{width:100%;height:58vh;border:1px solid var(--line);border-radius:12px;background:#fff}</style></head>
<body><div class="shell"><div class="top"><span>One US Brain</span><span id="state">Connecting</span></div><div class="switch"><button id="bHawk" type="button">Hawk</button><button id="bJeff" class="on" type="button">Jeff</button></div><section id="hawk" class="desk"></section><section id="jeff" class="desk on"></section><section id="room" class="room"></section></div>
<script>
const SB="https://suitcxemizusgocytkzg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1aXRjeGVtaXp1c2dvY3l0a3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI3MzgsImV4cCI6MjEwNjQ2ODczOH0.lQjjYxIQW5CC-z2URg8ojGLZ9zIhBLgZZTTcmSng0qo";
const headers={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let db={who:localStorage.getItem("ousb-who")||"jeff",marks:[],projects:[],assets:[],err:""};let openId=null;
const folders=[["Pine Tree Trail Lodge","First living Brain","lodge"],["One US Brand","Practice","brand"],["Sellout City","Universe","sellout"],["Jake & the Pitchforks","10001","jake"]];
async function loadAll(){
 const h={headers};
 const [m,p,a]=await Promise.all([
  fetch(SB+"/rest/v1/marks?select=id,room,by,text,at&order=at.desc",h),
  fetch(SB+"/rest/v1/projects?select=id,name,door,lead",h),
  fetch(SB+"/rest/v1/assets?select=id,project_id,kind,title,source,status",h)
 ]);
 if(!m.ok||!p.ok||!a.ok){db.err="Brain not reading.";document.getElementById("state").textContent="Not reading";return;}
 db.marks=await m.json();db.projects=await p.json();db.assets=await a.json();db.err="";document.getElementById("state").textContent="Brain";paint();
}
function card(t,e,r){return `<button class="card" data-room="${r}"><strong>${t}</strong><em>${e}</em></button>`;}
function markHtml(list){return list.map(m=>`<div class="card mark"><strong>${m.by} · ${m.at}</strong><em>${m.text}</em></div>`).join("")||`<p class="who">No marks yet.</p>`;}
function renderDesk(who){const name=who==="hawk"?"Hawk":"Jeff";const door=who==="hawk"?"1.oneusbrain.space":"2.oneusbrain.space";return `<h1>${name}</h1><p class="who">${door} · cofounder</p>${db.err?`<p class="err">${db.err}</p>`:""}<h2>From the Brain</h2>${db.projects.map(p=>card(p.name,p.lead+" · "+p.door,p.id)).join("")||"<p class=who>No projects.</p>"}<h2>Also on the desk</h2>${folders.filter(f=>!db.projects.some(p=>p.id===f[2])).map(f=>card(f[0],f[1],f[2])).join("")}<h2>Marks</h2>${markHtml(db.marks.slice(0,4))}`;}
function renderRoom(id){const p=db.projects.find(x=>x.id===id);const assets=db.assets.filter(x=>x.project_id===id);const title=p?p.name:(id==="brand"?"One US Brand":id==="sellout"?"Sellout City":"Jake & the Pitchforks");const sub=p?`Lead ${p.lead}. Door ${p.door}. This row is in the Brain.`:"Not a Brain row yet.";const list=assets.map(a=>`<div class="card"><strong>${a.title}</strong><em>${a.kind} · ${a.status}${a.source?` · <a href="${a.source}" target="_blank" rel="noopener">source</a>`:""}</em></div>`).join("")||"<p class=who>No assets in the Brain for this room.</p>";const site=assets.find(a=>a.kind==="website"&&a.source);const frame=site?`<iframe src="${site.source}" title="${title}"></iframe>`:"";return `<button class="back" id="back" type="button">Back</button><h1>${title}</h1><p class="who">${sub}</p><h2>Assets</h2>${list}${frame}<h2>Marks</h2>${markHtml(db.marks.filter(m=>m.room===id))}<textarea id="mark" rows="3" placeholder="Write the change."></textarea><div class="row"><button class="solid" id="save" type="button">Save mark</button></div>`;}
function paint(){if(openId)return openRoom(openId);showDesk();}
function showDesk(){openId=null;document.getElementById("switch").style.display="grid";document.getElementById("room").classList.remove("on");document.getElementById("hawk").className="desk"+(db.who==="hawk"?" on":"");document.getElementById("jeff").className="desk"+(db.who==="jeff"?" on":"");document.getElementById("bHawk").className=db.who==="hawk"?"on":"";document.getElementById("bJeff").className=db.who==="jeff"?"on":"";document.getElementById("hawk").innerHTML=renderDesk("hawk");document.getElementById("jeff").innerHTML=renderDesk("jeff");document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>openRoom(b.dataset.room));}
function openRoom(id){openId=id;document.getElementById("switch").style.display="none";document.getElementById("hawk").classList.remove("on");document.getElementById("jeff").classList.remove("on");const room=document.getElementById("room");room.classList.add("on");room.innerHTML=renderRoom(id);document.getElementById("back").onclick=showDesk;document.getElementById("save").onclick=saveMark;}
async function saveMark(){const text=document.getElementById("mark").value.trim();if(!text)return;const row={id:Date.now().toString(),room:openId,by:db.who,text,at:new Date().toISOString().slice(0,16).replace("T"," ")};const res=await fetch(SB+"/rest/v1/marks",{method:"POST",headers,body:JSON.stringify(row)});if(!res.ok){db.err="Save failed.";paint();return;}await loadAll();}
document.getElementById("bHawk").onclick=()=>{db.who="hawk";localStorage.setItem("ousb-who","hawk");showDesk();};document.getElementById("bJeff").onclick=()=>{db.who="jeff";localStorage.setItem("ousb-who","jeff");showDesk();};
showDesk();loadAll();setInterval(loadAll,8000);
</script></body></html>
