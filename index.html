<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>One US Brain</title>
<style>:root{--ink:#1c1915;--muted:#6d655c;--line:#e3dbd0;--paper:#f3efe8;--card:#fffcf8;--gold:#8a6a32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,Palatino,serif}button,textarea{font:inherit;color:inherit}.shell{max-width:760px;margin:0 auto;padding:14px 14px 48px}.top{display:flex;justify-content:space-between;font:11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;margin:14px 0 2px}.who{margin:0 0 12px;color:var(--muted)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.switch button,.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px;font-family:-apple-system,sans-serif;font-size:14px}.switch button.on{background:var(--ink);color:var(--paper)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:block;width:100%;text-align:left}.card strong{display:block;font-size:17px}.card em{font-style:normal;color:var(--muted);font:13px/1.35 -apple-system,sans-serif}h2{font:600 11px/1.2 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}.desk,.room{display:none}.desk.on,.room.on{display:block}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.row{display:flex;gap:8px;margin-top:8px}.solid{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-family:-apple-system,sans-serif}.mark{border-left:3px solid var(--gold)}a{color:var(--ink)}img.seal{width:88px;height:88px;display:block;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#ddd}</style></head>
<body><div class="shell"><div class="top"><span>oneusbrain.space</span><span id="state">Connecting</span></div><div class="switch" id="switch"><button id="bHawk" type="button">Hawk</button><button id="bJeff" class="on" type="button">Jeff</button></div><section id="hawk" class="desk"></section><section id="jeff" class="desk on"></section><section id="room" class="room"></section></div>
<script>
const SB="https://suitcxemizusgocytkzg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1aXRjeGVtaXp1c2dvY3l0a3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI3MzgsImV4cCI6MjEwNjQ2ODczOH0.lQjjYxIQW5CC-z2URg8ojGLZ9zIhBLgZZTTcmSng0qo";
const headers={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let db={who:localStorage.getItem("ousb-who")||"jeff",marks:[],photos:[],copy:null};let openId=null;
function markHtml(list){return list.map(m=>`<div class="card mark"><strong>${m.by} \u00b7 ${m.at}</strong><em>${m.text}</em></div>`).join("")||`<p class="who">No marks yet.</p>`;}
function renderDesk(who){const name=who==="hawk"?"Hawk":"Jeff";const door=who==="hawk"?"1.oneusbrain.space":"2.oneusbrain.space";return `<h1>${name}</h1><p class="who">${door}</p><h2>Projects</h2><button class="card" data-room="lodge"><strong>Pine Tree Trail Lodge</strong><em>${db.photos.length} photos. Listing copy in. Domain empty.</em></button><h2>Marks</h2>${markHtml(db.marks.slice(0,4))}`;}
function copyHtml(){const c=db.copy;if(!c)return "";return `<h2>Listing copy</h2><div class="card"><strong>${c.title}</strong><em>${c.subtitle}. ${c.facts}. ${c.host} ${c.rating}</em></div>${c.highlights.map(h=>`<div class="card"><strong>Highlight</strong><em>${h}</em></div>`).join("")}<div class="card"><strong>Opening</strong><em>${c.opening}</em></div><div class="card"><strong>The space</strong><em>${c.space}</em></div><div class="card"><strong>Guest access</strong><em>${c.access}</em></div><div class="card"><strong>Location</strong><em>${c.location}</em></div>`;}
function renderRoom(){const pics=db.photos.map(p=>`<a href="${p.src}" target="_blank" rel="noopener"><img src="${p.src}?im_w=480" alt="Lodge photo"></a>`).join("");return `<button class="back" id="back" type="button">Back</button><h1>Pine Tree Trail Lodge</h1><img class="seal" src="./lodge-logo.png" alt="Pine Tree Trail Lodge seal">${copyHtml()}<h2>Photos</h2><p class="who">${db.photos.length} listing photos. No captions on the photos.</p><div class="grid">${pics}</div><h2>Marks</h2>${markHtml(db.marks.filter(m=>m.room==="lodge"))}<textarea id="mark" rows="3" placeholder="Write the change."></textarea><div class="row"><button class="solid" id="save" type="button">Save mark</button></div>`;}
async function loadAll(){const [m,p,c]=await Promise.all([fetch(SB+"/rest/v1/marks?select=id,room,by,text,at&order=at.desc",{headers}),fetch("./lodge-photos.json"),fetch("./lodge-copy.json")]);db.marks=m.ok?await m.json():[];db.photos=p.ok?(await p.json()).photos||[]:[];db.copy=c.ok?await c.json():null;document.getElementById("state").textContent=db.photos.length+" photos";paint();}
function paint(){if(openId)return openRoom();document.getElementById("switch").style.display="grid";document.getElementById("room").classList.remove("on");document.getElementById("hawk").className="desk"+(db.who==="hawk"?" on":"");document.getElementById("jeff").className="desk"+(db.who==="jeff"?" on":"");document.getElementById("bHawk").className=db.who==="hawk"?"on":"";document.getElementById("bJeff").className=db.who==="jeff"?"on":"";document.getElementById("hawk").innerHTML=renderDesk("hawk");document.getElementById("jeff").innerHTML=renderDesk("jeff");document.querySelectorAll("[data-room]").forEach(b=>b.onclick=openRoom);}
function openRoom(){openId="lodge";document.getElementById("switch").style.display="none";document.getElementById("hawk").classList.remove("on");document.getElementById("jeff").classList.remove("on");const room=document.getElementById("room");room.classList.add("on");room.innerHTML=renderRoom();document.getElementById("back").onclick=()=>{openId=null;paint();};document.getElementById("save").onclick=saveMark;}
async function saveMark(){const text=document.getElementById("mark").value.trim();if(!text)return;const row={id:Date.now().toString(),room:"lodge",by:db.who,text,at:new Date().toISOString().slice(0,16).replace("T"," ")};const res=await fetch(SB+"/rest/v1/marks",{method:"POST",headers,body:JSON.stringify(row)});if(!res.ok)return;await loadAll();}
document.getElementById("bHawk").onclick=()=>{db.who="hawk";localStorage.setItem("ousb-who","hawk");paint();};document.getElementById("bJeff").onclick=()=>{db.who="jeff";localStorage.setItem("ousb-who","jeff");paint();};
paint();loadAll();
</script></body></html>
