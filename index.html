<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>One US Brain</title>
<style>:root{--ink:#1c1915;--muted:#6d655c;--line:#e3dbd0;--paper:#f3efe8;--card:#fffcf8;--gold:#8a6a32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,Palatino,serif}button,textarea{font:inherit;color:inherit}.shell{max-width:760px;margin:0 auto;padding:14px 14px 48px}.top{display:flex;justify-content:space-between;font:11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;margin:14px 0 2px}.who{margin:0 0 12px;color:var(--muted)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.switch button,.back{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px;font-family:-apple-system,sans-serif;font-size:14px}.switch button.on{background:var(--ink);color:var(--paper)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:block;width:100%;text-align:left}.card strong{display:block;font-size:17px}.card em{font-style:normal;color:var(--muted);font:13px/1.35 -apple-system,sans-serif}h2{font:600 11px/1.2 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}.desk,.room{display:none}.desk.on,.room.on{display:block}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.row{display:flex;gap:8px;margin-top:8px}.solid{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-family:-apple-system,sans-serif}.mark{border-left:3px solid var(--gold)}.err{color:#8a3b2f}a{color:var(--ink)}img.seal{width:120px;height:120px;display:block;margin:8px 0 12px}</style></head>
<body><div class="shell"><div class="top"><span>oneusbrain.space</span><span id="state">Connecting</span></div><div class="switch" id="switch"><button id="bHawk" type="button">Hawk</button><button id="bJeff" class="on" type="button">Jeff</button></div><section id="hawk" class="desk"></section><section id="jeff" class="desk on"></section><section id="room" class="room"></section></div>
<script>
const SB="https://suitcxemizusgocytkzg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1aXRjeGVtaXp1c2dvY3l0a3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI3MzgsImV4cCI6MjEwNjQ2ODczOH0.lQjjYxIQW5CC-z2URg8ojGLZ9zIhBLgZZTTcmSng0qo";
const headers={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let db={who:localStorage.getItem("ousb-who")||"jeff",marks:[],pack:null,err:""};let openId=null;
const labels={property:"Property",listing:"Listing",booking_link:"Booking",amenity:"Amenities",media:"Photos on record",review:"Reviews",station_about:"Radio",positioning:"Format",radio_show:"Shows",show_schedule:"Schedule",featured_artist:"Artists",featured_song:"Songs",host_story:"Voices",faq:"Questions"};
function markHtml(list){return list.map(m=>`<div class="card mark"><strong>${m.by} · ${m.at}</strong><em>${m.text}</em></div>`).join("")||`<p class="who">No marks yet.</p>`;}
function renderDesk(who){const name=who==="hawk"?"Hawk":"Jeff";const door=who==="hawk"?"1.oneusbrain.space":"2.oneusbrain.space";return `<h1>${name}</h1><p class="who">${door}</p>${db.err?`<p class="err">${db.err}</p>`:""}<h2>Projects</h2><button class="card" data-room="lodge"><strong>Pine Tree Trail Lodge</strong><em>Airbnb checked tonight. 4.93 from 54. Domain still empty.</em></button><h2>Marks</h2>${markHtml(db.marks.slice(0,4))}`;}
function renderRoom(){const nodes=(db.pack&&db.pack.nodes)||[];const groups=Object.keys(labels).map(t=>{const items=nodes.filter(n=>n.type===t);if(!items.length)return "";return `<h2>${labels[t]}</h2>`+items.map(n=>`<div class="card"><strong>${n.title}</strong><em>${n.summary}${(n.sources||[]).map(s=>` <a href="${s}" target="_blank" rel="noopener">source</a>`).join("")}</em></div>`).join("");}).join("");return `<button class="back" id="back" type="button">Back</button><h1>Pine Tree Trail Lodge</h1><img class="seal" src="./lodge-logo.png" alt="Pine Tree Trail Lodge seal"><p class="who">Hawk hosts. Jeff advises. Seen on Airbnb 2026-10-01.</p><div class="card"><strong>Central Maine’s Premier Residence!</strong><em>Entire home in Pittsfield, Maine. Guest favorite. Hosted by Haakon. Superhost. 5 years hosting. <a href="https://www.airbnb.com/rooms/1497190069664019981" target="_blank" rel="noopener">listing</a></em></div><div class="card"><strong>16+ guests · 5 bedrooms · 6 beds · 4.5 baths</strong><em>That is the listing header. The description still says sleeps 10. The checklist said 14. Header wins until Hawk corrects it.</em></div><div class="card"><strong>4.93 from 54 reviews</strong><em>Cleanliness 4.8. Accuracy 5.0. Check-in 4.9. Communication 5.0. Location 4.9. Value 4.9. The old 4.97 from 31 is stale.</em></div><div class="card"><strong>On the listing</strong><em>Kitchen, wifi, free parking, pets allowed, 59 inch TV, arcade, karaoke, grill, fire ring, yard. Two garages and the she-shed are not guest space.</em></div><div class="card"><strong>pinetreetraillodge.com</strong><em>Still an empty doorway. The listing is live. The site is not.</em></div>${groups}<h2>Marks</h2>${markHtml(db.marks.filter(m=>m.room==="lodge"))}<textarea id="mark" rows="3" placeholder="Write the change."></textarea><div class="row"><button class="solid" id="save" type="button">Save mark</button></div>`;}
async function loadAll(){const [m,n]=await Promise.all([fetch(SB+"/rest/v1/marks?select=id,room,by,text,at&order=at.desc",{headers}),fetch("./lodge-public.json")]);if(!m.ok){db.err="Marks not loading.";document.getElementById("state").textContent="Not reading";return;}db.marks=await m.json();db.pack=n.ok?await n.json():null;db.err=n.ok?"":"Lodge pack not loading.";document.getElementById("state").textContent="Listing checked";paint();}
function paint(){if(openId)return openRoom();document.getElementById("switch").style.display="grid";document.getElementById("room").classList.remove("on");document.getElementById("hawk").className="desk"+(db.who==="hawk"?" on":"");document.getElementById("jeff").className="desk"+(db.who==="jeff"?" on":"");document.getElementById("bHawk").className=db.who==="hawk"?"on":"";document.getElementById("bJeff").className=db.who==="jeff"?"on":"";document.getElementById("hawk").innerHTML=renderDesk("hawk");document.getElementById("jeff").innerHTML=renderDesk("jeff");document.querySelectorAll("[data-room]").forEach(b=>b.onclick=openRoom);}
function openRoom(){openId="lodge";document.getElementById("switch").style.display="none";document.getElementById("hawk").classList.remove("on");document.getElementById("jeff").classList.remove("on");const room=document.getElementById("room");room.classList.add("on");room.innerHTML=renderRoom();document.getElementById("back").onclick=()=>{openId=null;paint();};document.getElementById("save").onclick=saveMark;}
async function saveMark(){const text=document.getElementById("mark").value.trim();if(!text)return;const row={id:Date.now().toString(),room:"lodge",by:db.who,text,at:new Date().toISOString().slice(0,16).replace("T"," ")};const res=await fetch(SB+"/rest/v1/marks",{method:"POST",headers,body:JSON.stringify(row)});if(!res.ok){db.err="Save failed.";paint();return;}await loadAll();}
document.getElementById("bHawk").onclick=()=>{db.who="hawk";localStorage.setItem("ousb-who","hawk");paint();};document.getElementById("bJeff").onclick=()=>{db.who="jeff";localStorage.setItem("ousb-who","jeff");paint();};
paint();loadAll();
</script></body></html>
