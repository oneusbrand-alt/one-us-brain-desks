<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>One US Brain</title>
<style>:root{--ink:#1c1915;--muted:#6d655c;--line:#e3dbd0;--paper:#f3efe8;--card:#fffcf8;--gold:#8a6a32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,Palatino,serif}button,textarea{font:inherit;color:inherit}.shell{max-width:760px;margin:0 auto;padding:14px 14px 48px}.top{display:flex;justify-content:space-between;font:11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:30px;margin:14px 0 2px}.who{margin:0 0 12px;color:var(--muted)}.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.switch button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:10px;font-family:-apple-system,sans-serif;font-size:14px}.switch button.on{background:var(--ink);color:var(--paper)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.card strong{display:block;font-size:17px}.card em{font-style:normal;color:var(--muted);font:13px/1.35 -apple-system,sans-serif}h2{font:600 11px/1.2 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}.desk{display:none}.desk.on{display:block}textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.row{display:flex;gap:8px;margin-top:8px}.solid{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-family:-apple-system,sans-serif}.mark{border-left:3px solid var(--gold)}.err{color:#8a3b2f}a{color:var(--ink)}</style></head>
<body><div class="shell"><div class="top"><span>Desk</span><span id="state">Connecting</span></div><div class="switch"><button id="bHawk" type="button">Hawk</button><button id="bJeff" class="on" type="button">Jeff</button></div><section id="hawk" class="desk"></section><section id="jeff" class="desk on"></section></div>
<script>
const SB="https://suitcxemizusgocytkzg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1aXRjeGVtaXp1c2dvY3l0a3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI3MzgsImV4cCI6MjEwNjQ2ODczOH0.lQjjYxIQW5CC-z2URg8ojGLZ9zIhBLgZZTTcmSng0qo";
const headers={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let db={who:localStorage.getItem("ousb-who")||"jeff",marks:[],err:""};
function card(t,e){return `<div class="card"><strong>${t}</strong><em>${e}</em></div>`;}
function markHtml(list){return list.map(m=>`<div class="card mark"><strong>${m.by} · ${m.at}</strong><em>${m.text}</em></div>`).join("")||`<p class="who">No marks yet.</p>`;}
function renderDesk(who){const name=who==="hawk"?"Hawk":"Jeff";const door=who==="hawk"?"1.oneusbrain.space":"2.oneusbrain.space";return `<h1>${name}</h1><p class="who">${door} started tonight. Not a door yet.</p>${db.err?`<p class="err">${db.err}</p>`:""}<h2>Started tonight</h2>${card("oneusbrain.space","New build. Not live yet. Vercel is still in the address.")}<h2>Already live, not made tonight</h2>${card("oneusbrain.digital","Only live One US Brain domain.")}${card("125 Masons","125maine.masonbrain.org")}${card("Jake & the Pitchforks","Up. Address not recorded here.")}<h2>Empty</h2>${card("pinetreetraillodge.com","Points at Replit. No app there.")}<h2>Marks</h2>${markHtml(db.marks.slice(0,4))}<textarea id="mark" rows="3" placeholder="Write the change."></textarea><div class="row"><button class="solid" id="save" type="button">Save mark</button></div>`;}
async function loadAll(){const res=await fetch(SB+"/rest/v1/marks?select=id,room,by,text,at&order=at.desc",{headers});if(!res.ok){db.err="Marks not loading.";document.getElementById("state").textContent="Not reading";return;}db.marks=await res.json();db.err="";document.getElementById("state").textContent="Reading";paint();}
function paint(){document.getElementById("hawk").className="desk"+(db.who==="hawk"?" on":"");document.getElementById("jeff").className="desk"+(db.who==="jeff"?" on":"");document.getElementById("bHawk").className=db.who==="hawk"?"on":"";document.getElementById("bJeff").className=db.who==="jeff"?"on":"";document.getElementById("hawk").innerHTML=renderDesk("hawk");document.getElementById("jeff").innerHTML=renderDesk("jeff");const s=document.querySelector(".desk.on #save");if(s)s.onclick=saveMark;}
async function saveMark(){const text=document.querySelector(".desk.on #mark").value.trim();if(!text)return;const row={id:Date.now().toString(),room:"desk",by:db.who,text,at:new Date().toISOString().slice(0,16).replace("T"," ")};const res=await fetch(SB+"/rest/v1/marks",{method:"POST",headers,body:JSON.stringify(row)});if(!res.ok){db.err="Save failed.";paint();return;}await loadAll();}
document.getElementById("bHawk").onclick=()=>{db.who="hawk";localStorage.setItem("ousb-who","hawk");paint();};document.getElementById("bJeff").onclick=()=>{db.who="jeff";localStorage.setItem("ousb-who","jeff");paint();};
paint();loadAll();
</script></body></html>
