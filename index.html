<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>One US Brain</title>
<style>
  :root { --ink:#1c1915; --muted:#6d655c; --line:#e3dbd0; --paper:#f3efe8; --card:#fffcf8; --gold:#8a6a32; }
  * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:Georgia, Palatino, serif; }
  button, textarea { font:inherit; color:inherit; }
  .shell { max-width:760px; margin:0 auto; padding:14px 14px 48px; }
  .top { display:flex; justify-content:space-between; font:11px/1 -apple-system,sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:32px; margin:14px 0 2px; } .who { margin:0 0 12px; color:var(--muted); }
  .switch { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .switch button, .back { border:1px solid var(--line); background:transparent; border-radius:999px; padding:10px; font-family:-apple-system,sans-serif; font-size:14px; }
  .switch button.on { background:var(--ink); color:var(--paper); }
  .q, .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; }
  .q b, h2 { font:600 11px/1.2 -apple-system,sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
  h2 { color:var(--muted); margin:16px 0 8px; }
  .card { display:block; width:100%; text-align:left; } .card strong { display:block; font-size:17px; }
  .card em { font-style:normal; color:var(--muted); font:13px/1.35 -apple-system,sans-serif; }
  .desk, .room { display:none; } .desk.on, .room.on { display:block; }
  textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px; background:#fff; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .solid { border:0; background:var(--ink); color:var(--paper); border-radius:12px; padding:10px 14px; font-family:-apple-system,sans-serif; }
  .mark { border-left:3px solid var(--gold); } .err { color:#8a3b2f; }
  table { width:100%; border-collapse:collapse; font:15px/1.4 -apple-system,sans-serif; }
  td { border-bottom:1px solid var(--line); padding:8px 4px; vertical-align:top; }
  td:first-child { white-space:nowrap; color:var(--gold); }
  ol { margin:8px 0 0; padding-left:18px; } li { margin:6px 0; }
</style></head>
<body>
<div class="shell">
  <div class="top"><span>One US Brain</span><span id="state">Connecting</span></div>
  <div class="switch" id="switch"><button id="bHawk" type="button">Hawk</button><button id="bJeff" class="on" type="button">Jeff</button></div>
  <section id="hawk" class="desk"></section><section id="jeff" class="desk on"></section><section id="room" class="room"></section>
</div>
<script>
const SB="https://suitcxemizusgocytkzg.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1aXRjeGVtaXp1c2dvY3l0a3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTI3MzgsImV4cCI6MjEwNjQ2ODczOH0.lQjjYxIQW5CC-z2URg8ojGLZ9zIhBLgZZTTcmSng0qo";
const headers={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"};
let db={who:localStorage.getItem("ousb-who")||"jeff",marks:[],err:""}; let openId=null;
const domainTable=`<table><tr><td>1</td><td>Hawk · 1.oneusbrain.space</td></tr><tr><td>2</td><td>Jeff · 2.oneusbrain.space</td></tr><tr><td>10001</td><td>Jake &amp; the Pitchforks · 10001.oneusbrain.space</td></tr><tr><td>100000</td><td>Mason brains start</td></tr><tr><td>100001</td><td>Maine Grand Lodge · 100001.oneusbrain.space</td></tr><tr><td>100125</td><td>Lodge 125 · 100125.oneusbrain.space</td></tr></table>`;
const rollout=`<ol><li>Founder desks. Hawk on 1. Jeff on 2. Live now on the project. Vercel must not be in the address.</li><li>Add 1.oneusbrain.space and 2.oneusbrain.space on the project. Point DNS. Those are the doors.</li><li>Sign-in is who is sitting down. Not a public list.</li><li>Intelligence is a choice on the desk. Not locked to one model.</li><li>Build Jake &amp; the Pitchforks at 10001.</li><li>Build the Mason brain. Range starts at 100000. Maine Grand Lodge is 100001.</li><li>Build Lodge 125 at 100125.</li></ol>`;
const rooms={
 domains:{title:"Domain list",sub:"Numbers locked in this conversation.",body:domainTable},
 rollout:{title:"Rollout",sub:"Order from this conversation.",body:rollout},
 brand:{title:"One US Brand",sub:"First project on this desk.",body:""},
 lodge:{title:"Pine Tree Trail Lodge",sub:"Shared with Hawk.",body:""},
 jake:{title:"Jake & the Pitchforks",sub:"10001",body:""},
 putter:{title:"Broken Putter / JW Parks",sub:"Hawk.",body:""},
 gym:{title:"Gymnastics / XGTC",sub:"Hawk.",body:""}
};
async function loadMarks(){const res=await fetch(SB+"/rest/v1/marks?select=id,room,by,text,at&order=at.desc",{headers});if(!res.ok){db.err="Marks not loading.";document.getElementById("state").textContent="Not shared";return;}db.marks=await res.json();db.err="";document.getElementById("state").textContent="Shared";paint();}
function marksFor(room){return db.marks.filter(m=>m.room===room);}
function card(title,em,room){return `<button class="card" data-room="${room}"><strong>${title}</strong><em>${em}</em></button>`;}
function markHtml(list){return list.map(m=>`<div class="card mark"><strong>${m.by} · ${m.at}</strong><em>${m.text}</em></div>`).join("")||`<p class="who">No marks yet.</p>`;}
function renderDesk(who){const shared=markHtml(db.marks.slice(0,6));const warn=db.err?`<p class="err">${db.err}</p>`:"";if(who==="hawk")return `<h1>Hawk</h1><p class="who">1.oneusbrain.space</p>${warn}<h2>Shared marks</h2>${shared}<h2>On this desk</h2>${card("Domain list","Locked numbers","domains")}${card("Rollout","Order from this conversation","rollout")}<h2>Projects</h2>${card("Pine Tree Trail Lodge","Shared","lodge")}${card("Jake & the Pitchforks","10001","jake")}${card("Broken Putter / JW Parks","Hawk","putter")}${card("Gymnastics / XGTC","Hawk","gym")}`;return `<h1>Jeff</h1><p class="who">2.oneusbrain.space</p>${warn}<h2>Shared marks</h2>${shared}<h2>On this desk</h2>${card("Domain list","Locked numbers","domains")}${card("Rollout","Order from this conversation","rollout")}<h2>Projects</h2>${card("One US Brand","First project","brand")}${card("Pine Tree Trail Lodge","Shared with Hawk","lodge")}`;}
function renderRoom(id){const r=rooms[id];return `<button class="back" id="back" type="button">Back to desk</button><h1>${r.title}</h1><p class="who">${r.sub}</p>${r.body||""}<h2>Marks</h2>${markHtml(marksFor(id))}<textarea id="mark" rows="3" placeholder="Write the change."></textarea><div class="row"><button class="solid" id="save" type="button">Save mark</button></div>`;}
function paint(){if(openId)return openRoom(openId);showDesk();}
function showDesk(){openId=null;document.getElementById("switch").style.display="grid";document.getElementById("room").classList.remove("on");document.getElementById("hawk").className="desk"+(db.who==="hawk"?" on":"");document.getElementById("jeff").className="desk"+(db.who==="jeff"?" on":"");document.getElementById("bHawk").className=db.who==="hawk"?"on":"";document.getElementById("bJeff").className=db.who==="jeff"?"on":"";document.getElementById("hawk").innerHTML=renderDesk("hawk");document.getElementById("jeff").innerHTML=renderDesk("jeff");document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>openRoom(b.dataset.room));}
function openRoom(id){openId=id;document.getElementById("switch").style.display="none";document.getElementById("hawk").classList.remove("on");document.getElementById("jeff").classList.remove("on");const room=document.getElementById("room");room.classList.add("on");room.innerHTML=renderRoom(id);document.getElementById("back").onclick=showDesk;document.getElementById("save").onclick=saveMark;}
async function saveMark(){const text=document.getElementById("mark").value.trim();if(!text)return;const row={id:Date.now().toString(),room:openId,by:db.who,text,at:new Date().toISOString().slice(0,16).replace("T"," ")};const res=await fetch(SB+"/rest/v1/marks",{method:"POST",headers,body:JSON.stringify(row)});if(!res.ok){db.err="Save failed.";paint();return;}await loadMarks();}
document.getElementById("bHawk").onclick=()=>{db.who="hawk";localStorage.setItem("ousb-who","hawk");showDesk();};document.getElementById("bJeff").onclick=()=>{db.who="jeff";localStorage.setItem("ousb-who","jeff");showDesk();};
showDesk();loadMarks();setInterval(loadMarks,8000);
</script></body></html>
